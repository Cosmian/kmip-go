name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests: go vet + gofmt + go test -race ────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run unit tests via mise
        run: mise run test:unit

  # ── Live integration tests — no-auth HTTP ────────────────────────────────
  integration:
    name: Live integration tests (no-auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out test_data submodule
        run: |
          git submodule init test_data
          git submodule update --depth 1 test_data

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run live integration tests (no-auth)
        run: mise run test:live

  # ── Live integration tests — mTLS ────────────────────────────────────────
  integration-mtls:
    name: Live integration tests (mTLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out test_data submodule (certs only)
        run: |
          git submodule init test_data
          git submodule update --depth 1 test_data

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install openssl + xxd (needed by generate-test-certs.sh)
        run: sudo apt-get install -y openssl xxd

      - name: Generate test certificates
        run: bash test_data/spire/certs/generate-test-certs.sh

      - name: Run live integration tests (mTLS)
        run: mise run test:live --mtls

  # ── SPIRE e2e — kmip KeyManager plugin (mTLS) ────────────────────────────
  # Uses the spire submodule (Manuthor:feature/eviden-kms-plugins — KeyManager only).
  spire-e2e:
    name: SPIRE kmip e2e (mTLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out test_data submodule
        run: |
          git submodule init test_data
          git submodule update --depth 1 test_data

      - name: Check out spire submodule
        run: |
          git submodule init spire
          git submodule update --depth 1 spire

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install openssl + xxd
        run: sudo apt-get install -y openssl xxd

      - name: Generate test certificates
        run: bash test_data/spire/certs/generate-test-certs.sh

      - name: Run SPIRE e2e test
        run: mise run test:spire-e2e

  # ── SPIRE full integration — multi-tenant (KeyManager only) ─────────────
  # Uses the spire submodule (Manuthor:feature/eviden-kms-plugins — KeyManager only).
  spire:
    name: SPIRE kmip full integration (multi-tenant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out test_data submodule
        run: |
          git submodule init test_data
          git submodule update --depth 1 test_data

      - name: Check out spire submodule
        run: |
          git submodule init spire
          git submodule update --depth 1 spire

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install openssl + xxd + python3
        run: sudo apt-get install -y openssl xxd python3 python3-pip

      - name: Generate test certificates
        run: bash test_data/spire/certs/generate-test-certs.sh

      - name: Run SPIRE full integration test
        run: mise run test:spire

  # ── SPIRE kind cluster integration — KeyManager ───────────────────────────
  # Uses the spire submodule (Manuthor:feature/eviden-kms-plugins — KeyManager only).
  # Validates the key-manager-kmip integration suite (also run by SPIRE CI).
  kind-integration-km:
    name: Kind integration (kmip key-manager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out spire submodule
        run: |
          git submodule init spire
          git submodule update --depth 1 spire

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install openssl (needed by 01-setup-kms TLS cert generation)
        run: sudo apt-get install -y openssl

      - name: Build spire-server binary from submodule
        run: |
          cd spire
          go build -o bin/spire-server ./cmd/spire-server/

      - name: Build spire-server:latest-local Docker image
        run: |
          docker build -t spire-server:latest-local -f - spire/ <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
          COPY bin/spire-server /opt/spire/bin/spire-server
          ENTRYPOINT ["/opt/spire/bin/spire-server"]
          DOCKERFILE

      - name: Pull KMS image (pre-load before kind)
        run: docker pull ghcr.io/cosmian/kms:5.26.0

      - name: Run kind integration suite — KeyManager
        run: |
          cd spire/test/integration
          ./test.sh suites/key-manager-kmip

  # ── SPIRE kind cluster integration — UpstreamAuthority ───────────────────
  # Clones Cosmian:feature/kmip-upstream-authority (UpstreamAuthority only).
  # Validates the upstream-authority-kmip integration suite.
  kind-integration-ua:
    name: Kind integration (kmip upstream-authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install openssl (needed by 01-setup-kms TLS cert generation)
        run: sudo apt-get install -y openssl

      - name: Clone Cosmian/spire upstream-authority branch
        run: |
          git clone --depth 1 \
            --branch feature/kmip-upstream-authority \
            https://github.com/Cosmian/spire.git \
            spire

      - name: Build spire-server binary
        run: |
          cd spire
          go build -o bin/spire-server ./cmd/spire-server/

      - name: Build spire-server:latest-local Docker image
        run: |
          docker build -t spire-server:latest-local -f - spire/ <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
          COPY bin/spire-server /opt/spire/bin/spire-server
          ENTRYPOINT ["/opt/spire/bin/spire-server"]
          DOCKERFILE

      - name: Pull KMS image (pre-load before kind)
        run: docker pull ghcr.io/cosmian/kms:5.26.0

      - name: Run kind integration suite — UpstreamAuthority
        run: |
          cd spire/test/integration
          ./test.sh suites/upstream-authority-kmip
