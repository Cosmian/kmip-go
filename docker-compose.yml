# docker-compose.yml — centralized image version management for kmip-go tests
#
# All service images are pinned to explicit versions. Update versions here only;
# mise tasks reference this file via `docker compose` commands.
#
# Services:
#   kms        — no-auth HTTP (for quick unit-level integration tests)
#   kms-mtls   — mTLS HTTPS (for full production-like tests with cert_auth)
#
# Usage:
#   docker compose up -d kms          # no-auth HTTP on port 9998
#   docker compose up -d kms-mtls     # mTLS HTTPS on port 9998
#   docker compose down

services:

  # ── Eviden KMS — no-auth HTTP ─────────────────────────────────────────────
  # Simple configuration for fast iteration. No TLS, no client cert required.
  # Source: https://github.com/Cosmian/kms/pkgs/container/kms
  kms:
    image: ghcr.io/cosmian/kms:5.26.0
    container_name: kmip-go-kms
    environment:
      - KMS_DEFAULT_USERNAME=admin
    ports:
      - "9998:9998"
    restart: "no"

  # ── Eviden KMS — mTLS HTTPS ───────────────────────────────────────────────
  # Production-like configuration: TLS server cert + mutual TLS client cert
  # verification. SPIRE and the Go KMIP client must present spire-client.crt.
  # Certs are mounted read-only from test_data/spire/certs/.
  kms-mtls:
    image: ghcr.io/cosmian/kms:5.26.0
    container_name: kmip-go-kms-mtls
    environment:
      - KMS_DEFAULT_USERNAME=admin
    ports:
      - "9998:9998"
    volumes:
      # KMS server cert + key (presented to all HTTPS clients)
      - ./test_data/spire/certs/kms.crt:/etc/kms/certs/kms.crt:ro
      - ./test_data/spire/certs/kms.key:/etc/kms/certs/kms.key:ro
      # CA cert used to verify client certificates (enforces mTLS)
      - ./test_data/spire/certs/ca.crt:/etc/kms/certs/ca.crt:ro
      # KMS TOML config enabling TLS + clients_ca_cert_file
      - ./test_data/spire/config/kms-kmip.toml:/etc/kms/kms.toml:ro
    command: ["--config", "/etc/kms/kms.toml"]
    restart: "no"

