# docker-compose.yml — centralized image version management for kmip-go tests
#
# All service images are pinned to explicit versions.
#
# Services:
#   kms        — no-auth HTTP (for quick unit-level integration tests)
#   kms-mtls   — mTLS HTTPS (for full production-like tests with cert_auth)
#
# Usage:
#   docker compose up -d kms          # no-auth HTTP on port 9998
#   docker compose up -d kms-mtls     # mTLS HTTPS on port 9998
#   docker compose down

services:

  # ── Eviden KMS — no-auth HTTP ─────────────────────────────────────────────
  kms:
    image: ghcr.io/cosmian/kms:5.26.0
    container_name: kmip-go-kms
    environment:
      - KMS_DEFAULT_USERNAME=admin
    ports:
      - "9998:9998"
    restart: "no"

  # ── Eviden KMS — mTLS HTTPS ───────────────────────────────────────────────
  # Mutual TLS: every client must present a certificate signed by testdata/certs/ca.crt.
  # Regenerate certs when needed: bash scripts/generate-test-certs.sh
  kms-mtls:
    image: ghcr.io/cosmian/kms:5.26.0
    container_name: kmip-go-kms-mtls
    environment:
      - KMS_DEFAULT_USERNAME=admin
    ports:
      - "9998:9998"
    volumes:
      - ./testdata/certs/kms.crt:/etc/kms/certs/kms.crt:ro
      - ./testdata/certs/kms.key:/etc/kms/certs/kms.key:ro
      - ./testdata/certs/ca.crt:/etc/kms/certs/ca.crt:ro
      - ./testdata/kms-mtls.toml:/etc/kms/kms.toml:ro
    command: ["--config", "/etc/kms/kms.toml"]
    restart: "no"

